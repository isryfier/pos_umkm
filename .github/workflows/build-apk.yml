name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pasang Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Memasang kunci tanda tangan TETAP dari GitHub Secrets.
      # Dengan kunci yang sama di setiap build, APK baru bisa menimpa APK lama
      # tanpa uninstall (data menu & transaksi tetap aman).
      # Kunci ditaruh di lokasi debug.keystore, yang otomatis dipakai Flutter
      # untuk menandatangani APK, jadi file gradle tidak perlu diubah.
      - name: Pasang kunci tanda tangan tetap
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            # Gradle di mesin ini mencari kunci di ~/.config/.android,
            # jadi kunci yang sama ditaruh di kedua lokasi.
            mkdir -p ~/.config/.android
            cp ~/.android/debug.keystore ~/.config/.android/debug.keystore
            echo "Kunci tetap terpasang."
            echo "Sidik jari kunci hasil decode (harus diawali D8:50:A7:39):"
            keytool -list -keystore ~/.android/debug.keystore -storepass android 2>&1 | grep -i "SHA-256" || echo "::warning::Kunci hasil decode tidak bisa dibaca"
          else
            echo "::warning::Secret DEBUG_KEYSTORE_BASE64 belum diatur. APK memakai kunci acak (tidak bisa menimpa versi lama)."
          fi

      - name: Buat folder android jika belum ada
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name pos_kuliner .
          fi

      # Mengatur nama aplikasi di HP dan memasang ikon dari file app_icon.png
      # (di root repo). Kalau file ikon tidak ada, build tetap jalan dengan ikon bawaan.
      # Untuk mengganti nama aplikasi, ubah tulisan "POS Kasir" di baris sed berikut.
      - name: Pasang nama dan ikon aplikasi
        run: |
          sed -i 's/android:label="[^"]*"/android:label="POS Kuliner"/' android/app/src/main/AndroidManifest.xml
          if [ ! -f app_icon.png ]; then
            echo "::warning::app_icon.png tidak ditemukan di root repo. Memakai ikon bawaan Flutter."
            exit 0
          fi
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          import os
          src = Image.open('app_icon.png').convert('RGBA')
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for density, size in sizes.items():
              out = f'android/app/src/main/res/mipmap-{density}'
              os.makedirs(out, exist_ok=True)
              src.resize((size, size), Image.LANCZOS).save(f'{out}/ic_launcher.png')
          print('Ikon terpasang di semua ukuran layar.')
          PY

      - name: Ambil dependency
        run: flutter pub get

      # Beberapa paket Android (mis. file_picker) masih dibuat untuk API lama,
      # padahal pustaka pendampingnya mensyaratkan API 36. Skrip init Gradle ini
      # menaikkan compileSdk semua modul ke 36 supaya tidak error.
      - name: Naikkan compileSdk semua paket ke 36
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/force-compile-sdk.gradle <<'EOF'
          allprojects {
            afterEvaluate { p ->
              def androidExt = p.extensions.findByName('android')
              if (androidExt != null) {
                androidExt.compileSdk = 36
              }
            }
          }
          EOF
          echo "Init script terpasang:" && cat ~/.gradle/init.d/force-compile-sdk.gradle

      - name: Build APK release
        run: flutter build apk --release

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: pos-kuliner-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Ditaruh setelah unggah, jadi kalau langkah ini gagal APK tetap tersimpan.
      # Sidik jari kunci harus SAMA di setiap build. Untuk kunci tetap kita,
      # nilai SHA-256 diawali: d850a739
      - name: Tampilkan sidik jari kunci (untuk memastikan sama tiap build)
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -i "SHA-256"
