name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pasang Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Buat folder android jika belum ada
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name pos_kuliner .
          fi

      - name: Ambil dependency
        run: flutter pub get

      - name: Build APK release
        run: flutter build apk --release

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: pos-kuliner-apk
          path: build/app/outputs/flutter-apk/app-release.apk
