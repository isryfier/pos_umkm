name: pos_kuliner
description: Aplikasi kasir (POS) UMKM Kuliner.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Database lokal SQLite untuk Android
  sqflite: ^2.3.3
  # Membantu menentukan lokasi file database
  path: ^1.9.0
  # Hash SHA-256 untuk menyimpan password & PIN dengan aman (Sesi 5)
  crypto: ^3.0.3
  # Backup & pulihkan data (Sesi 6): lokasi folder sementara, bagikan file, pilih file
  path_provider: ^2.1.4
  share_plus: ^10.1.0
  file_picker: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
